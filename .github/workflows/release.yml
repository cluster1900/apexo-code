name: release

# Push a tag like v1.2.3 to build the CLI for every target and attach the archives
# to a GitHub Release. Only the built-in GITHUB_TOKEN is needed.
on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  workflow-interpreter:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: macos-15, target: aarch64-apple-darwin }
          - { runner: windows-2025, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build and test first-party Rhai interpreter
        shell: bash
        working-directory: packages/workflow-script
        env:
          WORKFLOW_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable "$WORKFLOW_TARGET"
          cargo +stable test --locked --target "$WORKFLOW_TARGET"
          cargo +stable build --release --locked --target "$WORKFLOW_TARGET"
          mkdir -p "artifacts/$WORKFLOW_TARGET"
          extension=""
          if [[ "$WORKFLOW_TARGET" == *windows* ]]; then extension=".exe"; fi
          cp "target/$WORKFLOW_TARGET/release/apexo-workflow-script$extension" "artifacts/$WORKFLOW_TARGET/"

      - name: Upload interpreter
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workflow-interpreter-${{ matrix.target }}
          path: packages/workflow-script/artifacts/
          if-no-files-found: error
          retention-days: 3

  release:
    needs: workflow-interpreter
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download target-native workflow interpreters
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: workflow-interpreter-*
          path: workflow-artifacts
          merge-multiple: true

      - name: Resolve version
        run: echo "APEXO_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Create draft release
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

      - name: Build and upload binaries
        working-directory: packages/apexo
        run: bun run build
        env:
          APEXO_CHANNEL: latest
          APEXO_RELEASE: "1"
          APEXO_WORKFLOW_ARTIFACTS: ${{ github.workspace }}/workflow-artifacts

      - name: Publish release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
