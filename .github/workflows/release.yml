name: release

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "packages/apexo/script/*release.ts"
      - "packages/apexo/script/smoke-release.mjs"
      - "packages/apexo/script/build.ts"
      - "packages/apexo/script/build-node.ts"
      - "packages/apexo/bin/apexo"
      - "packages/desktop/electron-builder.config.ts"
      - "packages/desktop/scripts/**"
      - "packages/workflow-script/script/artifact.ts"
      - "script/release"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (build only; publishing requires a tag on main)"
        required: true
        default: "1.0.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Validate version and main CI
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ inputs.version || '1.0.0' }}
        shell: bash
        run: |
          publish=false
          version="$BUILD_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            # Do not release an untested main commit, even if someone pushes a tag early.
            for attempt in {1..60}; do
              checks=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --paginate --jq '.check_runs[] | select(.app.slug == "github-actions") | [.name, .conclusion] | @tsv')
              if grep -qx $'unit (linux)\tsuccess' <<< "$checks" && grep -qx $'typecheck\tsuccess' <<< "$checks"; then break; fi
              if [[ "$attempt" == 60 ]]; then echo "Required main CI has not passed" >&2; exit 1; fi
              sleep 10
            done
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  workflow-interpreter:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: macos-15, target: aarch64-apple-darwin }
          - { runner: windows-2025, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install musl linker
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/workflow-script
          shared-key: release-${{ matrix.target }}
      - name: Build and test first-party Rhai interpreter
        shell: bash
        working-directory: packages/workflow-script
        env:
          WORKFLOW_TARGET: ${{ matrix.target }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable "$WORKFLOW_TARGET"
          cargo +stable test --locked --target "$WORKFLOW_TARGET"
          cargo +stable build --release --locked --target "$WORKFLOW_TARGET"
          mkdir -p "artifacts/$WORKFLOW_TARGET"
          extension=""
          if [[ "$WORKFLOW_TARGET" == *windows* ]]; then extension=".exe"; fi
          cp "target/$WORKFLOW_TARGET/release/apexo-workflow-script$extension" "artifacts/$WORKFLOW_TARGET/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workflow-interpreter-${{ matrix.target }}
          path: packages/workflow-script/artifacts/
          if-no-files-found: error
          retention-days: 7

  cli:
    needs: [version, workflow-interpreter]
    # macOS can ad-hoc sign both Mach-O architectures after Bun embeds the bundle.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APEXO_VERSION: ${{ needs.version.outputs.version }}
      APEXO_CHANNEL: latest
      APEXO_NPM_PACKAGE: ${{ vars.NPM_PACKAGE || 'apexo-code' }}
      APEXO_WORKFLOW_ARTIFACTS: ${{ github.workspace }}/workflow-artifacts
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --os=* --cpu=*
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: workflow-interpreter-*
          path: workflow-artifacts
          merge-multiple: true
      - name: Build all CLI targets with embedded web UI
        working-directory: packages/apexo
        run: bun run build --skip-install
      - name: Prepare CLI archives and npm packages
        working-directory: packages/apexo
        run: bun script/package-release.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-release
          path: |
            packages/apexo/dist/*.zip
            packages/apexo/dist/*.tar.gz
            packages/apexo/dist/npm/*.tgz
            packages/apexo/dist/npm/manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  cli-smoke:
    needs: [version, cli]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      APEXO_VERSION: ${{ needs.version.outputs.version }}
      APEXO_NPM_PACKAGE: ${{ vars.NPM_PACKAGE || 'apexo-code' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-release
          path: packages/apexo/dist
      - name: Install packed npm CLI and verify version
        shell: bash
        run: node packages/apexo/script/smoke-release.mjs

  desktop:
    needs: [version, workflow-interpreter]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, platform: mac, target: aarch64-apple-darwin }
          - { runner: ubuntu-24.04, platform: linux, target: x86_64-unknown-linux-gnu }
          - { runner: windows-2025, platform: win, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      APEXO_VERSION: ${{ needs.version.outputs.version }}
      APEXO_CHANNEL: prod
      APEXO_UNSIGNED: "1"
      NODE_OPTIONS: --max-old-space-size=6144
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      APEXO_WORKFLOW_ARTIFACTS: ${{ github.workspace }}/workflow-artifacts
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - uses: ./.github/actions/setup-bun
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workflow-interpreter-${{ matrix.target }}
          path: workflow-artifacts
      - name: Prepare version and sidecar
        working-directory: packages/desktop
        run: bun scripts/prepare.ts
      - name: Build Desktop
        working-directory: packages/desktop
        run: bun run build
      - name: Package Desktop
        working-directory: packages/desktop
        run: bun run package:${{ matrix.platform }} --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    needs: [version, cli-smoke, desktop]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cli-release
          path: artifacts/cli
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          path: artifacts/desktop
          merge-multiple: true
      - name: Create release and upload verified artifacts
        shell: bash
        run: |
          mv artifacts/cli/npm/manifest.json artifacts/cli/npm-manifest.json
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            cat > release-notes.md <<EOF
          Install the CLI with \`npm install -g apexo-code@${GITHUB_REF_NAME#v}\`, or download a standalone CLI archive below. Keep the CLI and its workflow interpreter together.

          Desktop installers are available for macOS Apple Silicon, Linux x64, and Windows x64. The current macOS build uses an ad-hoc signature without notarization; the Windows build has no publisher certificate.

          [Detailed installation guide](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/installation.md) · [Release automation guide](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/releases.md)

          Verify downloads using the attached \`SHA256SUMS\`.
          EOF
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md --generate-notes
          fi
          find artifacts -type f ! -name manifest.json ! -name SHA256SUMS -print0 | sort -z |
            while IFS= read -r -d '' file; do
              checksum=$(sha256sum "$file")
              printf '%s  %s\n' "${checksum%% *}" "$(basename "$file")"
            done > artifacts/SHA256SUMS
          find artifacts -type f ! -name manifest.json -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false

  npm:
    needs: [version, release]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-release
          path: packages/apexo/dist
      - name: Configure optional npm token
        shell: bash
        run: |
          if [[ -n "$NODE_AUTH_TOKEN" ]]; then
            echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$HOME/.npmrc"
          fi
      - name: Publish platform packages, then CLI launcher
        run: bun packages/apexo/script/publish-release.ts
