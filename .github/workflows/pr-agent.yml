name: PR Agent
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: write
  issues: write
concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true
jobs:
  pr_agent_job:
    # pull_request only (never pull_request_target): fork PRs get no secrets.
    # Comments: only repo owner/members/collaborators on PRs can trigger (repo is public).
    if: >-
      github.event.sender.type != 'Bot' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        startsWith(github.event.comment.body, '/')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: PR Agent action step
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI__KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI__API_BASE: https://api.minimax.cn/v1
          config.model: "openai/MiniMax-M2.7"
          config.model_weak: "openai/MiniMax-M2.7"
          config.model_reasoning: "openai/MiniMax-M2.7"
          config.fallback_models: '["openai/MiniMax-M2"]'
          config.custom_model_max_tokens: "128000"
          config.max_model_tokens: "64000"
          config.ai_timeout: "300"
          config.response_language: "zh-CN"
          pr_reviewer.extra_instructions: "请用简体中文输出所有审查内容。重点关注正确性 bug、安全问题（密钥泄露、注入、权限）、资源泄漏、错误处理缺失和缺少测试。"
          pr_code_suggestions.extra_instructions: "请用简体中文写建议说明。"
          pr_description.extra_instructions: "请用简体中文撰写。"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
