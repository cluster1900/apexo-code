name: recover release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stable tag to publish (for example v1.0.0)"
        required: true
      run_id:
        description: "Original tag release run with successful builds and installation checks"
        required: true

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      checks: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Verify original tagged source and successful build jobs
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          commit=$(git rev-parse "$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$commit" origin/main
          checks=$(gh api "repos/$GH_REPO/commits/$commit/check-runs" --paginate --jq '.check_runs[] | select(.app.slug == "github-actions") | [.name, .conclusion] | @tsv')
          grep -qx $'unit (linux)\tsuccess' <<< "$checks"
          grep -qx $'typecheck\tsuccess' <<< "$checks"
          gh api "repos/$GH_REPO/actions/runs/$RELEASE_RUN_ID" > original-run.json
          jq -e --arg commit "$commit" '.head_sha == $commit and .event == "push" and .status == "completed" and .path == ".github/workflows/release.yml"' original-run.json
          gh api "repos/$GH_REPO/actions/runs/$RELEASE_RUN_ID/jobs?per_page=100" > original-jobs.json
          jq -e '[.jobs[] | select(.name == "cli" or (.name | startswith("desktop (")) or (.name | startswith("cli-smoke (")))] | length == 10 and all(.conclusion == "success")' original-jobs.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-release
          path: artifacts/cli
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          path: artifacts/desktop
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Publish the existing verified artifacts
        run: bash script/publish-artifacts
