name: test

on:
  push:
    branches: [main, grok-agent-roadmap]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Prepare Rust for first-party workflow interpreter
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run unit tests
        timeout-minutes: 30
        run: GITHUB_ACTIONS=false bun turbo test --concurrency=2 --log-order=stream --log-prefix=none

      - name: Check generated client
        working-directory: packages/client
        run: bun run check:generated

      - name: Run HttpApi exerciser gates
        working-directory: packages/apexo
        run: bun run test:httpapi
