[config]
model = "openai/MiniMax-M2.7"
fallback_models = ["openai/MiniMax-M2"]
custom_model_max_tokens = 128000
max_model_tokens = 64000
ai_timeout = 300
response_language = "zh-CN"
publish_output_progress = false

[pr_reviewer]
extra_instructions = "请用简体中文输出所有审查内容。重点关注：正确性 bug、安全问题（密钥泄露、注入、权限）、并发/资源泄漏、错误处理缺失、缺少测试。"

[pr_code_suggestions]
extra_instructions = "请用简体中文写建议说明。"

[pr_description]
extra_instructions = "请用简体中文撰写。"
